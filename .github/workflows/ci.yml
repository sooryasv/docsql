name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docsql
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      MOCK_LLM: "true"
      RUN_SEED_ON_STARTUP: "false"
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/docsql_test
      ANALYTICS_READONLY_DATABASE_URL: postgresql://docsql_readonly:docsql_readonly@localhost:5432/docsql_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/docsql_test
      TEST_ANALYTICS_READONLY_DATABASE_URL: postgresql://docsql_readonly:docsql_readonly@localhost:5432/docsql_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - name: Install pinned dependencies
        run: |
          python -c "import tomllib;p=tomllib.load(open('pyproject.toml','rb'))['project'];print('\n'.join(p['dependencies']+p['optional-dependencies']['dev']))" > /tmp/req.txt
          pip install -r /tmp/req.txt
      - name: Create roles and test database
        run: psql -h localhost -U postgres -d docsql -v ON_ERROR_STOP=1 -f ../docker/init-roles.sql
      - name: Banned model id gate (exact retired id; the -lite variant is allowed)
        run: "! grep -rInE 'gemini-2\\.5-flash([^-]|$)' .. --include='*' --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.build --exclude=ci.yml"
      - run: ruff check app tests evals scripts
      - run: ruff format --check app tests evals scripts
      - run: mypy --strict app
      - run: alembic upgrade head
      - run: pytest -q
      - name: Offline eval (guard block rate)
        run: python -m evals.run_eval

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t docsql:ci .
